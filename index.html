<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div id="calculator">
        <div id="display"></div>
        <div id="keypad">
            <div class="row">
                <button class="num">1
                <button class="num">2
                <button class="num">3
                <button id="add" class="op">+
            </div>
            <div class="row">
                <button class="num">4
                <button class="num">5
                <button class="num">6
                <button class="op">-
            </div>
            <div class="row">
                <button class="num">7
                <button class="num">8
                <button class="num">9
                <button class="op">&#x00D7;
            </div>
            <div class="row">
                <button class="num">0
                <button class="op">.
                <button class="action">=
                <button class="op">&#x00F7;
            </div>
            <div class="row">
                <button class="action">C
            </div>
        </div>
    </div>
</body>

</html>
